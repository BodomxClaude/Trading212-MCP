[project]
name = "trading212-mcp"
version = "1.1.0"
description = "MCP server for the Trading 212 Public API — Docker-hosted, stateless Streamable HTTP and SSE"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1.1,<3",
    "httpx>=0.28.1",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
include = ["server.py", "client.py", "ratelimit.py", "tools/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
